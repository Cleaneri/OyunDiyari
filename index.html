<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Diyarı v1.0 - İndirme Merkezi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .download-container { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        h2 { color: #2b2b2b; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; margin-bottom: 30px; }
        .btn-group { display: flex; flex-direction: column; gap: 15px; }
        .download-btn { display: block; padding: 15px; font-size: 16px; font-weight: bold; text-decoration: none; border-radius: 8px; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .windows-btn { background: #007bff; color: white; }
        .windows-btn:hover { background: #0056b3; transform: translateY(-2px); }
        .android-btn { background: #28a745; color: white; }
        .android-btn:hover { background: #1e7e34; transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="download-container">
    <h2>Oyun Diyarı v1.0</h2>
    <p>Lütfen cihazınıza uygun olan sürümü seçip indirin.</p>

    <div class="btn-group">
        <!-- Windows İndirme Butonu -->
        <a href="/download/windows" class="download-btn windows-btn">Oyun Diyarı v1.0 Windows İndir</a>

        <!-- Android İndirme Butonu -->
        <a href="/download/android" class="download-btn android-btn">Oyun Diyarı v1.0 Android İndir</a>
    </div>
</div>

</body>
</html>
